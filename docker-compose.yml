services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supportsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supportsync}
      POSTGRES_DB: ${POSTGRES_DB:-supportsync}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supportsync}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis joins the stack in M3 Phase B: pub/sub fan-out of live notifications
  # across workers, plus the deferred rate limiting. Best-effort by design —
  # the backend fails open when Redis is unreachable (see backend/app/core/redis.py).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Backend and frontend containers are packaged with Docker in M4;
  # until then the backend runs locally via uvicorn (see README).

volumes:
  pgdata:
